# ---------------------------------------------------------------------------
# nginx-Konfiguration für www.nexoit.de (Hauptsite) unter aaPanel
#
# NICHT die ganze Datei ersetzen! aaPanel verwaltet die Blöcke zwischen
# #SSL-START/#SSL-END und #REWRITE-START/#REWRITE-END selbst und überschreibt
# sie bei jeder Änderung im Panel. Nur den PROXY-Block unten einsetzen.
#
# Datei auf dem Server: /www/server/panel/vhost/nginx/nexoit.de.conf
# Bequemer über: Website → nexoit.de → Konfigurationsdatei
# ---------------------------------------------------------------------------

# --- 1. Diese beiden Blöcke aus der aaPanel-Standardkonfiguration LÖSCHEN ---
#
# Sie liefern Bilder, JS und CSS direkt von der Festplatte aus. Bei einer
# Next.js-Anwendung liegt aber nichts davon im Website-Verzeichnis – die
# Dateien kommen aus dem Node-Prozess. Bleiben die Blöcke stehen, antwortet
# nginx auf /_next/static/... mit 404 und die Seite lädt ohne Stile.
#
#   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
#   {
#       expires      30d;
#       error_log /dev/null;
#       access_log /dev/null;
#   }
#
#   location ~ .*\.(js|css)?$
#   {
#       expires      12h;
#       error_log /dev/null;
#       access_log /dev/null;
#   }
#
# Ebenfalls entfernen, weil kein PHP läuft:
#   include enable-php-84.conf;


# --- 2. Diesen Block einsetzen ---------------------------------------------
#
# Das `^~` ist entscheidend: Es weist nginx an, nach diesem Präfix-Treffer
# gar nicht erst nach passenden Regex-Locations zu suchen. Ohne `^~` würden
# übrig gebliebene Regex-Blöcke die Anfragen abfangen.

location ^~ / {
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Wird von der Anwendung ausgewertet, wenn TRUST_PROXY=1 gesetzt ist.
    # Ohne diesen Header zählt die Statistik alle Besuche auf die Server-IP.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Kein Zwischenspeicher: Sonst landen angemeldete Ansichten des
    # Verwaltungsbereichs im Cache und werden an Fremde ausgeliefert.
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;

    # Reserve für den Build-Start und langsame SMTP-Server beim Testversand.
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    client_max_body_size 8m;
}

# Unveränderliche Build-Dateien dürfen dauerhaft im Browser bleiben.
# Next.js liefert sie mit Hash im Dateinamen aus.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_cache off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Der Verwaltungsbereich gehört nicht in Suchmaschinen. Doppelt gesichert:
# Die Anwendung sendet den Header selbst, hier noch einmal auf Serverebene.
location ^~ /admin {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}


# --- 3. Einmalig in die globale nginx-Konfiguration ------------------------
#
# $connection_upgrade wird oben verwendet und ist in aaPanel nicht immer
# vordefiniert. Falls `nginx -t` die Variable bemängelt, in
# /www/server/nginx/conf/nginx.conf innerhalb des http { } - Blocks ergänzen:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# Alternativ die beiden Upgrade-Zeilen oben einfach entfernen – WebSockets
# braucht diese Anwendung im Produktivbetrieb nicht.
