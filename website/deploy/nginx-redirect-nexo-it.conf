# ---------------------------------------------------------------------------
# Weiterleitung der Alt-/Zweitdomains auf die Hauptdomain
#
#   nexo-it.de       ─┐
#   www.nexo-it.de   ─┼─► https://www.nexoit.de   (301, dauerhaft)
#   nexoit.de        ─┘
#
# Warum 301 und nicht 302: Nur die dauerhafte Weiterleitung überträgt die
# Suchmaschinen-Bewertung auf das neue Ziel. Ein 302 würde beide Domains
# dauerhaft konkurrieren lassen (Duplicate Content).
#
# Warum ein eigener Server-Block statt der Panel-Funktion "Redirect":
# aaPanels Weiterleitung hängt sich in die bestehende Site ein. Für eine
# fremde Domain braucht es einen eigenen vHost samt eigenem Zertifikat –
# sonst bricht der Browser die Verbindung mit einer Zertifikatswarnung ab,
# bevor die Weiterleitung überhaupt greift.
#
# Vorgehen im Panel:
#   1. Website → Add site, Domains: nexo-it.de und www.nexo-it.de
#      (PHP-Version: "Static" / "Not create", kein FTP, keine Datenbank)
#   2. DNS: A-Records beider Domains auf die Server-IP zeigen lassen
#   3. SSL → Let's Encrypt → beide Domains auswählen → beantragen
#   4. Konfigurationsdatei der Site öffnen und ihren Inhalt durch das
#      Folgende ersetzen – die von aaPanel erzeugten Blöcke zwischen
#      #SSL-START und #SSL-END dabei UNVERÄNDERT stehen lassen.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name nexo-it.de www.nexo-it.de nexoit.de;

    # Let's Encrypt muss diesen Pfad auch ohne HTTPS erreichen können,
    # sonst schlägt die automatische Verlängerung fehl.
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/nexo-it.de;
        allow all;
    }

    location / {
        return 301 https://www.nexoit.de$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexo-it.de www.nexo-it.de nexoit.de;

    #SSL-START  ← von aaPanel erzeugte Zertifikatszeilen hier stehen lassen
    ssl_certificate     /www/server/panel/vhost/cert/nexo-it.de/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/nexo-it.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    #SSL-END

    # $request_uri erhält Pfad und Parameter, damit ein alter Link auf
    # nexo-it.de/impressum auch auf www.nexoit.de/impressum landet.
    return 301 https://www.nexoit.de$request_uri;
}
