# ===========================================================================
# Vollständige nginx-Konfiguration für nexoit.de
#
# Ziel:  /www/server/panel/vhost/nginx/nexoit.de.conf
# Im Panel: Website → nexoit.de → Konfigurationsdatei
#
# Diese Datei ersetzt die von aaPanel erzeugte Fassung vollständig. Die von
# aaPanel verwalteten Abschnitte (CERT-APPLY-CHECK, SSL-START/END, REWRITE)
# sind unverändert übernommen – das Panel findet seine Markierungen also
# wieder und kann Zertifikate weiterhin selbst erneuern.
#
# REIHENFOLGE:
#   1. DNS: A-Record "www" auf 159.195.224.228 anlegen
#   2. Warten, bis `dig +short www.nexoit.de A` die IP zurückgibt
#   3. Diese Datei einsetzen
#   4. SSL → Let's Encrypt erneut beantragen, diesmal MIT www.nexoit.de
#   5. nginx -t && nginx -s reload
#
# Ohne Schritt 1 und 4 scheitert der Aufruf über www an einer
# Zertifikatswarnung.
# ===========================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    http2 on;
    http3 on;

    # GEÄNDERT: www ergänzt. Vorher stand hier nur "nexoit.de", dadurch wäre
    # www.nexoit.de auf der Standard-Site des Servers gelandet.
    server_name nexoit.de www.nexoit.de;

    # GEÄNDERT: zeigt nicht mehr auf das Repository-Verzeichnis, sondern nur
    # auf den öffentlichen Ordner der Anwendung. Da unten alles an Node
    # weitergereicht wird, liefert nginx ohnehin keine Dateien aus – aber
    # sollte diese Konfiguration je verloren gehen, liegen so wenigstens
    # nicht .env, .git und die Datenbank im ausgelieferten Verzeichnis.
    root /www/wwwroot/nexoit.de/website/public;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/nexoit.de.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/nexoit.de/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/nexoit.de/privkey.pem;
    # GEÄNDERT: TLSv1.1 entfernt. Das Protokoll gilt seit RFC 8996 als
    # überholt und wird von aktuellen Browsern ohnehin abgelehnt.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ENTFERNT: add_header Strict-Transport-Security ...
    # Den Header setzt die Anwendung selbst (siehe next.config.mjs). Stünde er
    # zusätzlich hier, sendet der Server ihn doppelt.
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/nexoit.de.conf;
    #REWRITE-END

    # Kanonische Adresse ist www.nexoit.de – Aufrufe ohne www werden dauerhaft
    # dorthin umgeleitet. Ein einziger Host verhindert, dass Suchmaschinen
    # dieselbe Seite unter zwei Adressen bewerten.
    if ($host = nexoit.de) {
        return 301 https://www.nexoit.de$request_uri;
    }

    # Verbot sensibler Pfade. Greift praktisch nie, weil unten alles an Node
    # geht – bleibt als zweite Absicherung stehen.
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    # Verzeichnis für die Zertifikatsprüfung von Let's Encrypt.
    location ~ \.well-known {
        allow all;
    }
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # -----------------------------------------------------------------------
    # ENTFERNT – und das ist der wichtigste Punkt:
    #
    #   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; ... }
    #   location ~ .*\.(js|css)?$                  { expires 12h; ... }
    #
    # Diese Blöcke liefern Dateien direkt von der Festplatte aus. Bei einer
    # Next.js-Anwendung liegt dort aber nichts – Skripte und Stile kommen aus
    # dem Node-Prozess unter /_next/static/. Bleiben die Blöcke stehen,
    # antwortet nginx darauf mit 404 und die Seite erscheint völlig ohne
    # Gestaltung. Reguläre Ausdrücke werden vor Präfix-Locations geprüft,
    # deshalb hilft auch der Proxy weiter unten nicht dagegen.
    #
    # Ebenfalls entfernt: include enable-php-00.conf;
    # Es läuft kein PHP. (Die "00" steht bei aaPanel für "kein PHP", die Zeile
    # war also harmlos – sie kann trotzdem weg.)
    # -----------------------------------------------------------------------

    # Unveränderliche Build-Dateien: Der Dateiname enthält einen Hash, ein
    # geänderter Inhalt bekommt also einen neuen Namen. Deshalb darf der
    # Browser sie dauerhaft behalten.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Alles Übrige an die Anwendung.
    #
    # Das `^~` ist entscheidend: Es sagt nginx, nach diesem Präfix-Treffer gar
    # nicht mehr nach passenden regulären Ausdrücken zu suchen.
    location ^~ / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Wird von der Anwendung ausgewertet, sobald TRUST_PROXY=1 gesetzt ist.
        # Fehlt der Header, zählt die Besucherstatistik jeden Aufruf auf die
        # IP des nginx und zeigt dauerhaft genau einen Besucher.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Kein Zwischenspeicher: Sonst könnten angemeldete Ansichten des
        # Verwaltungsbereichs im Cache landen und an Fremde ausgeliefert
        # werden.
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;

        # Reserve für langsame SMTP-Server beim Testversand im Admin.
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 8m;
    }

    access_log  /www/wwwlogs/nexoit.de.log;
    error_log  /www/wwwlogs/nexoit.de.error.log;
}
