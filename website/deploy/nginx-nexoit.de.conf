# ===========================================================================
# nginx-Konfiguration für nexoit.de – vollständig, zum Ersetzen
#
# Ziel:      /www/server/panel/vhost/nginx/nexoit.de.conf
# Im Panel:  Website → nexoit.de → Konfigurationsdatei
#
# Die von aaPanel verwalteten Abschnitte (CERT-APPLY-CHECK, SSL, ERROR-PAGE,
# PHP-INFO, REWRITE) sind mitsamt ihren Markierungen übernommen – das Panel
# findet sie also wieder und kann Zertifikate weiterhin selbst erneuern.
#
# REIHENFOLGE:
#   1. DNS: A-Record "www" auf 159.195.224.228 anlegen
#   2. Warten, bis `dig +short www.nexoit.de A` die IP zurückgibt
#   3. Diese Datei einsetzen
#   4. SSL → Let's Encrypt neu beantragen, diesmal MIT www.nexoit.de
#   5. nginx -t && nginx -s reload
#
# Schritt 4 nicht überspringen: Das vorhandene Zertifikat gilt nur für
# nexoit.de. Ohne Erneuerung bricht jeder Aufruf über www mit einer
# Zertifikatswarnung ab, noch bevor die Weiterleitung greifen kann.
# ===========================================================================

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    listen [::]:80;

    # GEÄNDERT: www ergänzt.
    # Vorsicht beim Kopieren – hier standen zuletzt eckige Klammern und eine
    # URL in Klammern dahinter. Das ist Markdown, kein nginx; damit bricht
    # `nginx -t` mit einem Syntaxfehler ab. Es gehören nur die beiden Namen
    # hin, getrennt durch ein Leerzeichen.
    server_name nexoit.de www.nexoit.de;

    index index.html;

    # GEÄNDERT: zeigt nicht mehr auf das Repository-Verzeichnis, sondern nur
    # auf den öffentlichen Ordner der Anwendung. Weil unten alles an Node
    # weitergereicht wird, liefert nginx ohnehin keine Dateien aus – sollte
    # diese Konfiguration aber je verloren gehen, liegen so wenigstens nicht
    # .env, .git und die Datenbank im ausgelieferten Verzeichnis.
    root /www/wwwroot/nexoit.de/website/public;

    include /www/server/panel/vhost/nginx/extension/nexoit.de/*.conf;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/nexoit.de.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/nexoit.de/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/nexoit.de/privkey.pem;
    # GEÄNDERT: TLSv1.1 entfernt – seit RFC 8996 überholt und von aktuellen
    # Browsern ohnehin abgelehnt.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ENTFERNT: add_header Strict-Transport-Security "max-age=31536000";
    # Den Header setzt die Anwendung selbst. Stünde er zusätzlich hier, sendet
    # der Server ihn doppelt. Sollte aaPanel die Zeile nach einer Änderung an
    # den SSL-Einstellungen wieder einfügen: unschön, aber harmlos.
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    # ENTFERNT: error_page 404 /404.html; error_page 502 /502.html;
    # Die 404-Seite liefert Next.js selbst. Die Dateien 404.html und 502.html
    # liegen zudem nicht mehr im Wurzelverzeichnis (siehe root oben) – nginx
    # würde beim Ausfall der Anwendung also einen Folgefehler statt einer
    # verständlichen Meldung ausgeben.
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    # ENTFERNT: include enable-php-00.conf;
    # Es läuft kein PHP. ("00" steht bei aaPanel für "kein PHP", die Zeile war
    # also folgenlos – sie kann trotzdem weg.)
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/nexoit.de.conf;
    #REWRITE-END

    # -----------------------------------------------------------------------
    # Kanonische Adresse: https://www.nexoit.de
    #
    # Leitet zusammen um: Aufrufe ohne www, und Aufrufe über HTTP. Ein einziger
    # gültiger Host verhindert, dass Suchmaschinen dieselbe Seite unter
    # mehreren Adressen bewerten.
    #
    # Der Umweg über die Variable ist nötig, weil nginx kein UND/ODER in `if`
    # kennt. Die dritte Zeile nimmt das Verzeichnis von Let's Encrypt wieder
    # aus – sonst würde die Zertifikatsprüfung auf HTTPS umgeleitet, das es
    # beim allerersten Antrag noch gar nicht gibt.
    # -----------------------------------------------------------------------
    set $nx_redirect "";
    if ($scheme = http)                  { set $nx_redirect "1"; }
    if ($host != www.nexoit.de)          { set $nx_redirect "1"; }
    if ($request_uri ~ ^/\.well-known/)  { set $nx_redirect "";  }
    if ($nx_redirect = "1") {
        return 301 https://www.nexoit.de$request_uri;
    }

    # -----------------------------------------------------------------------
    # Zertifikatsprüfung von Let's Encrypt – MUSS als Präfix-Location mit `^~`
    # geschrieben sein und vor dem Proxy stehen.
    #
    # Hintergrund: Der Proxy unten ist `location ^~ /`. Das `^~` weist nginx
    # an, nach diesem Präfix-Treffer überhaupt nicht mehr nach regulären
    # Ausdrücken zu suchen. Eine Regel wie `location ~ \.well-known` wird
    # dadurch nie erreicht – die Prüfanfrage landet bei Node, das den Pfad
    # nicht kennt, und Let's Encrypt bekommt einen 404.
    #
    # Diese Location gewinnt, weil nginx unter den Präfix-Treffern den
    # längsten wählt: "/.well-known/acme-challenge/" schlägt "/".
    #
    # Das eigene `root` ist nötig, weil das Wurzelverzeichnis des Servers oben
    # auf website/public zeigt. aaPanel legt die Prüfdatei aber im
    # Website-Verzeichnis der Site ab.
    #
    # Ohne diesen Block schlägt nicht nur der erste Antrag fehl, sondern auch
    # jede automatische Verlängerung nach 60 Tagen – dann läuft das
    # Zertifikat unbemerkt ab.
    # -----------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/nexoit.de;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
        access_log off;
    }

    # Verbot sensibler Pfade. Greift nur, wenn der Proxy unten einmal fehlt –
    # bleibt als zweite Absicherung stehen.
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md)
    {
        return 404;
    }

    # -----------------------------------------------------------------------
    # ENTFERNT – der wichtigste Punkt an dieser Konfiguration:
    #
    #   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; ... }
    #   location ~ .*\.(js|css)?$                  { expires 12h; ... }
    #
    # Diese Blöcke liefern Dateien direkt von der Festplatte. Bei einer
    # Next.js-Anwendung liegt dort aber nichts – Skripte und Stile kommen
    # unter /_next/static/ aus dem Node-Prozess. Bleiben die Blöcke stehen,
    # antwortet nginx darauf mit 404 und die Seite erscheint völlig ohne
    # Gestaltung.
    #
    # Der Proxy weiter unten hilft dagegen nicht: nginx prüft reguläre
    # Ausdrücke VOR Präfix-Locations. Die Blöcke müssen weg.
    # -----------------------------------------------------------------------

    # Unveränderliche Build-Dateien. Der Dateiname enthält einen Hash, ein
    # geänderter Inhalt bekommt also einen neuen Namen – der Browser darf sie
    # deshalb dauerhaft behalten.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Alles Übrige an die Anwendung.
    #
    # Das `^~` ist entscheidend: Es weist nginx an, nach diesem Präfix-Treffer
    # gar nicht mehr nach passenden regulären Ausdrücken zu suchen.
    location ^~ / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Wird ausgewertet, sobald TRUST_PROXY=1 in der .env steht. Fehlt der
        # Header, zählt die Besucherstatistik jeden Aufruf auf die IP des
        # nginx und zeigt dauerhaft genau einen Besucher.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Kein Zwischenspeicher: Sonst könnten angemeldete Ansichten des
        # Verwaltungsbereichs im Cache landen und an Fremde ausgeliefert
        # werden.
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;

        # Reserve für langsame SMTP-Server beim Testversand im Admin.
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 8m;
    }

    access_log  /www/wwwlogs/nexoit.de.log;
    error_log  /www/wwwlogs/nexoit.de.error.log;
}
